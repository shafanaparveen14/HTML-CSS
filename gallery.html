<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        @media (max-width: 600px) {
            .gallery img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">
        <img src="mountain.webp" alt="Image 1">
        <img src="https://picsum.photos/300/200?2" alt="Image 2">
        <img src="https://picsum.photos/300/200?3" alt="Image 3">
        <img src="https://picsum.photos/300/200?4" alt="Image 4">
        <img src="https://picsum.photos/300/200?5" alt="Image 5">
        <img src="https://picsum.photos/300/200?6" alt="Image 6">
        
    </div>

</body>
</html>
